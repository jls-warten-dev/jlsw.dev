<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — José Luis Sánchez Warten</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230B0E14'/%3E%3Ctext x='50' y='68' font-size='52' font-family='monospace' fill='%234ADE80' text-anchor='middle'&gt;&gt;_&lt;/text%3E%3C/svg%3E">
  <style>
    :root{
      --bg:#0B0E14;--bg-raise:#11151F;--border:#1D2433;--text:#E6EDF3;
      --muted:#8B98A9;--accent:#4ADE80;
      --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    html[data-theme="light"]{
      --bg:#FAFBFC;--bg-raise:#FFFFFF;--border:#E3E8EF;--text:#1B2430;
      --muted:#5C6B7E;--accent:#15803D;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{background:var(--bg);color-scheme:dark}
    html[data-theme="light"]{color-scheme:light}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column}
    .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem}
    .term{width:100%;max-width:640px;background:var(--bg-raise);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
    .bar{display:flex;align-items:center;gap:.45rem;padding:.6rem .9rem;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
    .dot{width:.7rem;height:.7rem;border-radius:50%}
    .dot-r{background:#FF5F57}.dot-y{background:#FEBC2E}.dot-g{background:#28C840}
    .title{margin-left:.5rem;color:var(--muted);font-family:var(--mono);font-size:.8rem}
    pre{padding:1.4rem 1.2rem;font-family:var(--mono);font-size:.92rem;line-height:1.75;white-space:pre-wrap;word-break:break-word}
    .p{color:var(--accent)}
    .err{color:#F87171}
    .dim{color:var(--muted)}
    .big{font-family:var(--mono);font-size:2.6rem;font-weight:700;letter-spacing:-.03em;padding:0 1.2rem 1rem}
    .big span{color:var(--accent)}
    .cta{display:flex;gap:.75rem;flex-wrap:wrap;padding:0 1.2rem 1.5rem}
    .btn{font-family:var(--mono);font-size:.88rem;text-decoration:none;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--border);color:var(--text)}
    .btn.primary{background:var(--accent);color:#08110B;border-color:transparent;font-weight:600}
    footer{padding:1.1rem;text-align:center;color:var(--muted);font-family:var(--mono);font-size:.78rem;border-top:1px solid var(--border)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="term">
      <div class="bar" aria-hidden="true">
        <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
        <span class="title">jose@homelab: ~</span>
      </div>
      <pre><span class="p">$</span> cd <span class="dim">&lt;lo-que-buscabas&gt;</span>
<span class="err">bash: cd: lo-que-buscabas: No such file or directory</span></pre>
      <div class="big">4<span>0</span>4</div>
      <div class="cta">
        <a class="btn primary" href="/">cd ~</a>
        <a class="btn" href="/blog/">ls blog/</a>
      </div>
    </div>
  </div>
  <footer>jlsw.dev · error 404 · la página que buscas no existe</footer>
</body>
</html>
